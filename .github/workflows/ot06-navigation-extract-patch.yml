name: OT-06 navigation extraction patch

on:
  push:
    branches:
      - feat/ot-multi-technician-visits-v1
    paths:
      - .github/workflows/ot06-navigation-extract-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ot-multi-technician-visits-v1
          fetch-depth: 0
      - name: Extract navigation from App exactly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()

          for line in [
            "import type { LucideIcon } from 'lucide-react';\n",
            "  BarChart3,\n",
            "  CalendarDays,\n",
            "  Home,\n",
            "  Settings2,\n",
            "  UsersRound,\n",
          ]:
            assert text.count(line) == 1, f'import line not found exactly once: {line!r}'
            text = text.replace(line, '', 1)

          capabilities_import = "import { hasCapability } from './auth/capabilities';\n"
          navigation_import = "import { mainNavigation, secondaryNavigation, type NavItem, type View } from './navigation/appNavigation';\n"
          assert text.count(capabilities_import) == 1, 'capabilities import not found exactly once'
          assert navigation_import not in text, 'navigation import already present'
          text = text.replace(capabilities_import, capabilities_import + navigation_import, 1)

          local_types = """type View = 'dashboard' | 'orders' | 'planning' | 'detail' | 'create' | 'technician' | 'technicians' | 'clients' | 'assets' | 'reports' | 'audit' | 'configuration';\ntype NavItem = { id: View; label: string; icon: LucideIcon };\n"""
          assert text.count(local_types) == 1, 'local navigation types not found exactly once'
          text = text.replace(local_types, '', 1)

          arrays = """export const mainNavigation: NavItem[] = [\n  { id: 'dashboard', label: 'Dashboard', icon: Home },\n  { id: 'orders', label: 'Órdenes', icon: ClipboardList },\n  { id: 'planning', label: 'Planificación', icon: CalendarDays },\n  { id: 'technician', label: 'Técnico', icon: Wrench },\n];\n\nexport const secondaryNavigation: NavItem[] = [\n  { id: 'technicians', label: 'Técnicos', icon: UsersRound },\n  { id: 'clients', label: 'Clientes / instalaciones', icon: Building2 },\n  { id: 'reports', label: 'Informes', icon: BarChart3 },\n  { id: 'audit', label: 'Auditoría', icon: ShieldCheck },\n  { id: 'configuration', label: 'Configuración', icon: Settings2 },\n];\n\n"""
          assert text.count(arrays) == 1, 'navigation arrays block not found exactly once'
          text = text.replace(arrays, '', 1)

          path.write_text(text)
          PY
          git diff --check
          test "$(git diff --numstat -- src/App.tsx | awk '{print $1+$2}')" -le 30
      - name: Commit navigation extraction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git diff --cached --exit-code && exit 1 || true
          git commit -m "refactor: consumir navegación OT desde módulo puro"
          git push origin HEAD:feat/ot-multi-technician-visits-v1
