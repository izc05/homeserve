name: OT-06E contract patch

on:
  push:
    branches:
      - feat/ot-multi-technician-visits-v1
    paths:
      - .github/workflows/ot06e-contract-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ot-multi-technician-visits-v1
          fetch-depth: 0
      - name: Patch OT-06E contracts exactly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          acl = Path('supabase/tests/function_execute_privileges.sql')
          text = acl.read_text()
          row = "  ('public.handover_work_order_responsibility(uuid,uuid,text,boolean)', true),"
          anchor = "  ('public.log_audit(uuid,text,text,uuid,jsonb)', true),"
          old_count = "  50,\n  '1. la matriz ACL enumera las 50 funciones públicas de aplicación'"
          new_count = "  51,\n  '1. la matriz ACL enumera las 51 funciones públicas de aplicación'"
          assert row not in text, 'handover ACL already present'
          assert text.count(anchor) == 1, 'ACL anchor not found exactly once'
          assert text.count(old_count) == 1, 'ACL count not found exactly once'
          text = text.replace(anchor, row + "\n" + anchor, 1)
          text = text.replace(old_count, new_count, 1)
          acl.write_text(text)

          test = Path('supabase/tests/work_order_handover_v1.sql')
          text = test.read_text()
          old = """select is((select count(*)::integer from ot_visitas where ot_id='56000000-0000-0000-0000-000000000001' and tecnico_id='16000000-0000-0000-0000-000000000003' and estado='EN_CURSO'),1,'21. visita activa del entrante se conserva durante el relevo');\nselect ok(can_execute_work_order('26000000-0000-0000-0000-000000000001','56000000-0000-0000-0000-000000000001'),'22. nuevo responsable continúa pudiendo ejecutar la OT');\nselect throws_matching(\n"""
          new = """select is((select count(*)::integer from ot_visitas where ot_id='56000000-0000-0000-0000-000000000001' and tecnico_id='16000000-0000-0000-0000-000000000003' and estado='EN_CURSO'),1,'21. visita activa del entrante se conserva durante el relevo');\nselect set_config('request.jwt.claim.sub','16000000-0000-0000-0000-000000000003',true);\nselect ok(can_execute_work_order('26000000-0000-0000-0000-000000000001','56000000-0000-0000-0000-000000000001'),'22. nuevo responsable continúa pudiendo ejecutar la OT');\nselect set_config('request.jwt.claim.sub','16000000-0000-0000-0000-000000000001',true);\nselect throws_matching(\n"""
          assert text.count(old) == 1, 'handover actor block not found exactly once'
          test.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit OT-06E contract patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/tests/function_execute_privileges.sql supabase/tests/work_order_handover_v1.sql
          git diff --cached --exit-code && exit 1 || true
          git commit -m "test: completar contratos de relevo OT-06E"
          git push origin HEAD:feat/ot-multi-technician-visits-v1
