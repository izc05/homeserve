name: OT-06D ACL patch

on:
  push:
    branches:
      - feat/ot-multi-technician-visits-v1
    paths:
      - .github/workflows/ot06d-acl-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ot-multi-technician-visits-v1
          fetch-depth: 0
      - name: Patch ACL contract exactly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/tests/function_execute_privileges.sql')
          text = path.read_text()

          close_row = "  ('public.close_my_work_order_visit(uuid,jsonb)', true),"
          final_row = "  ('public.finalize_work_order_technical(uuid,text)', true),"
          close_anchor = "  ('public.complete_scheduled_maintenance_from_work_order(uuid)', false),"
          final_anchor = "  ('public.finalize_active_work_order_visit(uuid,jsonb)', true),"
          old_count = "  48,\n  '1. la matriz ACL enumera las 48 funciones públicas de aplicación'"
          new_count = "  50,\n  '1. la matriz ACL enumera las 50 funciones públicas de aplicación'"

          assert close_row not in text, 'close_my_work_order_visit already present'
          assert final_row not in text, 'finalize_work_order_technical already present'
          assert text.count(close_anchor) == 1, 'close anchor not found exactly once'
          assert text.count(final_anchor) == 1, 'finalize anchor not found exactly once'
          assert text.count(old_count) == 1, 'ACL count assertion not found exactly once'

          text = text.replace(close_anchor, close_row + "\n" + close_anchor, 1)
          text = text.replace(final_anchor, final_anchor + "\n" + final_row, 1)
          text = text.replace(old_count, new_count, 1)
          path.write_text(text)
          PY
          git diff --check
          test "$(git diff --numstat -- supabase/tests/function_execute_privileges.sql | awk '{print $1+$2}')" -le 6
      - name: Commit ACL contract patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/tests/function_execute_privileges.sql
          git diff --cached --exit-code && exit 1 || true
          git commit -m "test: añadir RPC de cierre OT-06D a matriz ACL"
          git push origin HEAD:feat/ot-multi-technician-visits-v1
