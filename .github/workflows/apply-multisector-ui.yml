name: Apply multisector UI wording

on:
  push:
    branches: [feat/isivoltpro-ot-ecosystem]
    paths:
      - .github/workflows/apply-multisector-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/isivoltpro-ot-ecosystem
          fetch-depth: 0

      - name: Replace photovoltaic-only wording
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/App.tsx'): [
                  ("{ id: 'assets', label: 'Equipos FV', icon: Boxes }", "{ id: 'assets', label: 'Activos y equipos', icon: Boxes }"),
                  ('<span className="avatar avatar-small">FV</span>', '<span className="avatar avatar-small">OT</span>'),
              ],
              Path('src/features/work-orders/components/CreateWorkOrderForm.tsx'): [
                  ("type: 'fotovoltaica'", "type: 'general'"),
                  ("type: 'inversor_fotovoltaico'", "type: 'equipo_general'"),
                  ('Alta rápida de instalación FV', 'Alta rápida de instalación'),
                  ('Ej. Cubierta FV edificio A', 'Ej. Hospital, nave industrial o edificio A'),
                  ('FV-CUB-001', 'INST-001'),
                  ('placeholder="fotovoltaica"', 'placeholder="hospitalaria, industrial, residencial..."'),
                  ('Foto instalación completa', 'Foto general de la instalación'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}, found {count}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          Path('.github/workflows/apply-multisector-ui.yml').unlink()
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: convertir interfaz a alcance multisector"
          git push origin HEAD:feat/isivoltpro-ot-ecosystem
