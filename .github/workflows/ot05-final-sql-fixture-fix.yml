name: OT05 Final SQL Fixture Fix

on:
  push:
    branches:
      - feat/ot-technical-system-v1
    paths:
      - '.github/workflows/ot05-final-sql-fixture-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/ot-technical-system-v1
          fetch-depth: 0

      - name: Rename exact demo fixture
        run: |
          test "$(git hash-object supabase/tests/fixtures/seed_demo.sql)" = "814ae76ec22b110b32f56add4f83ae449996220c"
          test "$(grep -Fc '\ir fixtures/seed_demo.sql' supabase/tests/demo_seed.sql)" = "2"
          git mv supabase/tests/fixtures/seed_demo.sql supabase/tests/fixtures/seed_demo.inc
          sed -i 's#\\ir fixtures/seed_demo\.sql#\\ir fixtures/seed_demo.inc#g' supabase/tests/demo_seed.sql
          test "$(git hash-object supabase/tests/fixtures/seed_demo.inc)" = "814ae76ec22b110b32f56add4f83ae449996220c"
          test "$(grep -Fc '\ir fixtures/seed_demo.inc' supabase/tests/demo_seed.sql)" = "2"
          test ! -e supabase/tests/fixtures/seed_demo.sql
          git diff --check

      - name: Commit rename
        run: |
          git config user.name 'IsiVoltPro Mantenimiento'
          git config user.email 'isiciozafracantos@gmail.com'
          git add supabase/tests/demo_seed.sql supabase/tests/fixtures/seed_demo.inc supabase/tests/fixtures/seed_demo.sql
          git commit -m 'test: ocultar fixture demo al descubrimiento pgTAP'
          git push origin HEAD:feat/ot-technical-system-v1
